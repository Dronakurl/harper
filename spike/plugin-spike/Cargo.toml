[package]
name = "plugin-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harper-core = { path = "../../harper-core", default-features = false }
serde_json = "1"
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "0.3" }

[profile.release]
opt-level = 3
panic = "abort"
lto = "fat"
codegen-units = 1
