[package]
name = "harper-plugin-api"
version = "2.12.0"
edition = "2024"
description = "The interface between Harper and language plugins compiled to WebAssembly."
license = "Apache-2.0"
repository = "https://github.com/automattic/harper"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
harper-core = { path = "../harper-core", version = "2.0.0", default-features = false, optional = true }

[features]
default = []
# Conversions between `harper_core::Lint` and `PluginLint`.
core = ["dep:harper-core"]

# The example plugin is the fixture for the host's integration tests.
# Build it with `cargo build --release --example echo --target wasm32-unknown-unknown`.
[[example]]
name = "echo"
crate-type = ["cdylib"]
