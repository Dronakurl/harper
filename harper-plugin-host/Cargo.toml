[package]
name = "harper-plugin-host"
version = "2.12.0"
edition = "2024"
description = "Loads Harper language plugins (WebAssembly modules) and runs them."
license = "Apache-2.0"
repository = "https://github.com/automattic/harper"

[dependencies]
harper-plugin-api = { path = "../harper-plugin-api", version = "2.0.0", features = ["core"] }
harper-core = { path = "../harper-core", version = "2.0.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
dirs = "6.0.0"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
